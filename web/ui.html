<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,
      user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f16">
<title>Wallbox</title>
<style>
  /* Fuers Handy im Querformat: EIN Bildschirm, kein Scrollen, keine Lupe.
     Alle Groessen wachsen mit der Bildschirmhoehe (svh = die kleine
     Ansichtshoehe, also die mit sichtbarer Adressleiste) — sonst waere der
     Inhalt entweder abgeschnitten oder auf einem Tablet verloren klein. */
  :root{
    --bg:#0b0f16; --tile:#161c26; --tile2:#1d242f; --line:#2a323f;
    --tx:#e8edf4; --mut:#8a97a8;
    --netz:#e0553f; --haus:#9aa7b8; --lad:#3d8bfd; --pv:#f2c14a; --gruen:#2bb47e;
    --e: 1svh;                      /* Grundmass */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-text-size-adjust:100%}

  /* Das Fahrzeug liegt als ruhiger Hintergrund hinter allem. Damit es
     ueberhaupt durchkommt, sind die Kacheln leicht durchscheinend — sonst
     saehe man das Auto nur in den Fugen. Aufgehellt, weil ein dunkles Auto
     auf dunklem Grund sonst verschwindet, und nach links ausgeblendet,
     damit unter den Zahlen kein Kontrast verloren geht. */
  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:url("/fahrzeug.png") no-repeat right -2% bottom 14%/60% auto;
    opacity:.42;filter:brightness(1.5) saturate(.8);
    -webkit-mask-image:linear-gradient(to left,#000 45%,transparent 92%);
    mask-image:linear-gradient(to left,#000 45%,transparent 92%)}
  header,main,footer,#warn{position:relative;z-index:1}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
  body{background:var(--bg);color:var(--tx);
    font:600 calc(2.6*var(--e))/1.25 system-ui,-apple-system,"Segoe UI",sans-serif;
    height:100svh;display:flex;flex-direction:column;
    gap:calc(1.2*var(--e));
    padding:calc(1.2*var(--e)) calc(1.2*var(--e)) calc(1.4*var(--e));
    padding-left:max(calc(1.2*var(--e)), env(safe-area-inset-left));
    padding-right:max(calc(1.2*var(--e)), env(safe-area-inset-right));
    padding-bottom:max(calc(1.4*var(--e)), env(safe-area-inset-bottom))}

  /* Kopfzeile */
  header{display:flex;align-items:center;gap:calc(1.6*var(--e));flex:none;
    font-size:calc(4*var(--e))}
  header .punkt{width:calc(2.2*var(--e));height:calc(2.2*var(--e));border-radius:50%;
    background:#4a5566;flex:none}
  header .punkt.an{background:var(--gruen);box-shadow:0 0 calc(1.4*var(--e)) #2bb47e99}
  header .punkt.warn{background:var(--netz)}
  header b{font-weight:700}
  header .mut{color:var(--mut);font-weight:500}
  header .rechts{margin-left:auto;display:flex;gap:calc(1*var(--e))}
  header a,header button{color:var(--mut);background:none;border:1px solid var(--line);
    border-radius:calc(1.4*var(--e));padding:calc(.9*var(--e)) calc(1.6*var(--e));
    font:inherit;font-size:calc(3*var(--e));text-decoration:none;cursor:pointer}

  /* Mittelteil: links der Ladepunkt, rechts die Messwerte */
  main{flex:1;display:grid;grid-template-columns:minmax(0,34fr) minmax(0,66fr);
    gap:calc(1.2*var(--e));min-height:0}
  .kasten{background:rgba(22,28,38,.78);border:1px solid var(--line);
    border-radius:calc(2.2*var(--e));padding:calc(1.6*var(--e));min-height:0}

  .lp{display:flex;flex-direction:column;justify-content:center;
    gap:calc(.9*var(--e))}
  .lp .watt{font-size:calc(14.5*var(--e));font-weight:750;line-height:.95;
    font-variant-numeric:tabular-nums;color:var(--lad)}
  .lp .watt.aus{color:var(--mut)}
  .lp .watt small{font-size:calc(4.2*var(--e));color:var(--mut)}
  .lp .grund{color:var(--mut);font-size:calc(3*var(--e));font-weight:500;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .lp .zeile{display:flex;gap:calc(2.6*var(--e));font-size:calc(3.2*var(--e));
    color:var(--mut);font-weight:500;flex-wrap:wrap}
  .lp .zeile b{color:var(--tx);font-weight:700}

  .gitter{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
    gap:calc(1.2*var(--e));min-height:0}
  .k{display:flex;flex-direction:column;min-height:0;
    background:rgba(22,28,38,.78);border:1px solid var(--line);
    border-radius:calc(2.2*var(--e));padding:calc(1.2*var(--e)) calc(1.5*var(--e))}
  .k .t{font-size:calc(2.6*var(--e));color:var(--mut);letter-spacing:.06em;
    text-transform:uppercase;font-weight:700}
  .k .v{font-size:calc(8.2*var(--e));font-weight:750;line-height:1.05;
    font-variant-numeric:tabular-nums;margin-top:calc(.2*var(--e))}
  .k .v small{font-size:calc(3.2*var(--e));color:var(--mut);margin-left:.15em}
  .k .z{font-size:calc(2.6*var(--e));color:var(--mut);font-weight:500}
  .k.netz .v{color:var(--netz)} .k.netz.ein .v{color:var(--gruen)}
  .k.pv .v{color:var(--pv)} .k.haus .v{color:var(--haus)} .k.bat .v{color:var(--gruen)}
  /* Der Verlauf ist Beiwerk — feste, kleine Hoehe. Mit flex:1 fuellte er die
     ganze Kachel und sah aus wie eine farbige Flaeche statt wie ein Verlauf. */
  .balken{display:flex;align-items:flex-end;gap:1px;flex:none;
    height:calc(8*var(--e));margin-top:auto}
  .balken i{flex:1;border-radius:1px 1px 0 0;background:var(--line);min-width:1px}
  .balken i.luecke{height:1px !important;background:#222a36}

  /* Lademodi */
  footer{flex:none;display:grid;grid-template-columns:repeat(7,1fr);
    gap:calc(1*var(--e))}
  footer button{background:rgba(29,36,47,.86);color:var(--tx);border:1px solid var(--line);
    border-radius:calc(1.8*var(--e));padding:calc(1.4*var(--e)) 0;
    font:700 calc(3.2*var(--e)) system-ui,sans-serif;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:calc(.3*var(--e))}
  footer button span{font-size:calc(2.3*var(--e));color:var(--mut);font-weight:500}
  footer button:active{transform:scale(.96)}
  footer button.sel{background:var(--gruen);border-color:var(--gruen);color:#04130c}
  footer button.sel span{color:#06301f}
  footer button.stop.sel{background:var(--netz);border-color:var(--netz);color:#2a0606}
  footer button.stop.sel span{color:#43100f}

  /* Hinweise */
  #warn{flex:none;background:#3a1d1d;border:1px solid #7a3434;color:#ffbfb0;
    border-radius:calc(1.4*var(--e));padding:calc(1*var(--e)) calc(1.4*var(--e));
    font-size:calc(2.8*var(--e));font-weight:500;display:none}

  /* Hochkant hat diese Ansicht keinen Sinn — dann lieber klar ansagen,
     statt alles zusammenzuquetschen. */
  #quer{position:fixed;inset:0;background:var(--bg);display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;
    text-align:center;padding:24px;font-size:17px;z-index:9}
  /* ohne Breitenbegrenzung laeuft der Satz aus dem Bild — die Flexbox
     zentriert dann ein Kind, das breiter ist als der Bildschirm */
  #quer>div{max-width:min(30ch,100%);overflow-wrap:anywhere}
  #quer .dreh{font-size:56px;animation:dreh 2.4s ease-in-out infinite}
  @keyframes dreh{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
  @media (orientation:portrait){#quer{display:flex}}
</style></head><body>

<div id="quer"><div class="dreh">📱</div>
  <div><b>Bitte quer halten.</b><br>Diese Ansicht ist fürs Querformat.</div>
  <div style="color:var(--mut);font-size:14px">Hochkant passt
    <a href="/display" style="color:var(--gruen)">/display</a> besser.</div>
</div>

<header>
  <span class="punkt" id="punkt"></span>
  <b id="watt-kopf">Wallbox</b>
  <span class="mut" id="uhr"></span>
  <span class="rechts">
    <button onclick="vollbild()">⛶</button>
    <a href="/">Einstellungen</a>
  </span>
</header>

<div id="warn"></div>

<main>
  <div class="kasten lp">
    <div class="t" style="font-size:calc(2.6*var(--e));color:var(--mut);
         letter-spacing:.06em;text-transform:uppercase;font-weight:700">Ladeleistung</div>
    <div class="watt" id="lade">0<small> W</small></div>
    <div class="grund" id="grund">–</div>
    <div class="zeile">
      <span><b id="w-amp">–</b> A</span>
      <span><b id="w-kwh">–</b> kWh</span>
      <span id="w-temp-box"><b id="w-temp">–</b> °C</span>
    </div>
    <div class="zeile"><span id="w-cp">–</span></div>
  </div>

  <div class="gitter">
    <div class="k pv">
      <div class="t">PV</div><div class="v" id="v-pv">–</div>
      <div class="balken" id="b-pv"></div>
    </div>
    <div class="k netz" id="k-netz">
      <div class="t">Netz</div><div class="v" id="v-netz">–</div>
      <div class="z" id="z-netz"></div>
      <div class="balken" id="b-netz"></div>
    </div>
    <div class="k haus">
      <div class="t">Haus</div><div class="v" id="v-haus">–</div>
      <div class="balken" id="b-haus"></div>
    </div>
    <div class="k bat">
      <div class="t">Speicher</div><div class="v" id="v-bat">–</div>
      <div class="z" id="z-bat"></div>
      <div class="balken" id="b-lad"></div>
    </div>
  </div>
</main>

<footer id="modi"></footer>

<script>
const MODI = [["stop","Stop","aus"],["sofort","Sofort","fest"],["pv","PV","Sonne"],
  ["minpv","Min+PV","Min+Sonne"],["ziel","Ziel","bis Uhr"],["zeit","Zeit","Fenster"],
  ["eco","Eco","günstig"]];
let CP = null, holen = true;
const $ = id => document.getElementById(id);

/* Werte werden ab 1 kW in kW gezeigt — vierstellige Wattzahlen sind auf
   einem Handydisplay schlechter zu lesen als eine Kommastelle. */
function zahl(v){
  if (v === null || v === undefined) return ['–', ''];
  const a = Math.abs(v);
  return a >= 1000 ? [(v / 1000).toFixed(1).replace('.', ','), ' kW']
                   : [String(Math.round(v)), ' W'];
}
function setz(id, v){
  const [t, e] = zahl(v);
  $(id).innerHTML = t + (e ? '<small>' + e + '</small>' : '');
}

function vollbild(){
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}

function balken(id, reihe, farbe, zweiseitig){
  const el = $(id);
  if (!reihe || !reihe.length){ el.innerHTML = ''; return; }
  const bekannt = reihe.filter(v => v !== null);
  if (!bekannt.length){ el.innerHTML = ''; return; }
  const max = Math.max(1, ...bekannt.map(v => Math.abs(v)));
  el.innerHTML = reihe.map(v => {
    if (v === null) return '<i class="luecke"></i>';   // Lücke bleibt Lücke
    const h = Math.max(4, Math.round(Math.abs(v) / max * 100));
    const f = (zweiseitig && v < 0) ? 'var(--gruen)' : farbe;
    return '<i style="height:' + h + '%;background:' + f + '"></i>';
  }).join('');
}

async function verlauf(){
  try{
    const d = await (await fetch('/api/verlauf?punkte=32')).json();
    balken('b-pv', d.pv, 'var(--pv)', false);
    balken('b-netz', d.netz, 'var(--netz)', true);
    balken('b-haus', d.haus, 'var(--haus)', false);
    balken('b-lad', d.laden, 'var(--lad)', false);
  }catch(e){}
}

async function live(){
  let d;
  try{ d = await (await fetch('/api/live')).json(); }
  catch(e){
    $('warn').textContent = 'Keine Verbindung zur Steuerung.';
    $('warn').style.display = 'block';
    return;
  }
  $('warn').style.display = 'none';
  $('uhr').textContent = new Date().toLocaleTimeString('de-DE',
      {hour:'2-digit', minute:'2-digit'});

  const m = d.meter || {};
  setz('v-pv', m.ok ? m.pv_w : null);
  const netz = m.ok ? m.grid_w : null;
  setz('v-netz', netz === null ? null : Math.abs(netz));
  $('k-netz').classList.toggle('ein', netz !== null && netz < 0);
  $('z-netz').textContent = !m.ok ? 'kein Zählerwert'
      : (netz < 0 ? 'Einspeisung' : 'Bezug');
  setz('v-haus', m.ok ? m.home_w : null);
  setz('v-bat', (m.ok && m.battery_w !== null) ? Math.abs(m.battery_w) : null);
  $('z-bat').textContent = (!m.ok || m.battery_w === null) ? ''
      : ((m.battery_w > 0 ? 'lädt' : 'entlädt')
         + (m.soc_pct === null || m.soc_pct === undefined
            ? '' : ' · ' + Math.round(m.soc_pct) + ' %'));

  const c = (d.chargepoints || [])[0];
  if (!c) return;
  CP = c.id;
  $('watt-kopf').textContent = c.name || d.name || 'Wallbox';
  const [t, e] = zahl(c.power_w);
  $('lade').innerHTML = t + '<small>' + (e || ' W') + '</small>';
  $('lade').classList.toggle('aus', !c.charging);
  $('punkt').className = 'punkt' + (c.charging ? ' an' : (c.online ? '' : ' warn'));
  $('grund').textContent = c.online ? c.reason : 'Wallbox nicht erreichbar';
  $('w-amp').textContent = c.amp || 0;
  $('w-kwh').textContent = (c.session_kwh ?? 0).toFixed(2);
  $('w-temp').textContent = c.temp_c ? Math.round(c.temp_c) : '–';
  $('w-cp').textContent = c.cp_text
      || (c.plugged ? 'Fahrzeug steckt' : 'kein Fahrzeug');

  const mo = $('modi');
  if (mo.dataset.m !== c.mode){
    mo.dataset.m = c.mode;
    mo.innerHTML = MODI.map(([k, tt, s]) =>
      '<button class="' + (k === 'stop' ? 'stop ' : '') + (k === c.mode ? 'sel' : '') +
      '" onclick="setzeModus(\'' + k + '\')">' + tt +
      '<span>' + s + '</span></button>').join('');
  }
}

async function setzeModus(k){
  await fetch('/api/chargepoint/' + encodeURIComponent(CP) + '/mode',
    {method:'POST', headers:{'content-type':'application/json'},
     body: JSON.stringify({mode: k})});
  $('modi').dataset.m = '';        // Neuzeichnen erzwingen
  live();
}

// Im Hintergrund nicht abfragen — die Seite laeuft den ganzen Tag.
document.addEventListener('visibilitychange', () => {
  holen = !document.hidden;
  if (holen){ live(); verlauf(); }
});
live(); verlauf();
setInterval(() => holen && live(), 5000);
setInterval(() => holen && verlauf(), 30000);
</script>
</body></html>
