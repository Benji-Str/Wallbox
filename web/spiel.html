<!doctype html><html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,
      user-scalable=no,viewport-fit=cover">
<title>Sonnenlauf</title>
<style>
  /* Ein Tipp-Spiel fuers Wanddisplay. Absichtlich EIGENE Figuren und
     Formen, keine fremden Spielfiguren — alles hier ist gezeichnet, nicht
     kopiert. Kein Bild, kein Ton, keine fremde Bibliothek: eine Datei, die
     auch im abgeschotteten Netz laeuft.

     Steuerung: irgendwohin tippen (oder Leertaste) = springen. Laenger
     halten = hoeher. Mehr braucht es nicht — an einem Display an der Wand
     gibt es keinen Controller. */
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f16;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
    user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100%;height:100%}
  .lage{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2.2vh;text-align:center;
    color:#e8edf4;font:600 2.4vh/1.4 system-ui,-apple-system,sans-serif;
    background:rgba(11,15,22,.82);padding:4vh}
  .lage h1{font-size:6vh;margin:0;font-weight:750;letter-spacing:.02em}
  .lage .gross{font-size:8vh;font-weight:750;color:#f2c14a;
    font-variant-numeric:tabular-nums}
  .lage .mut{color:#8a97a8;font-weight:500}
  .lage button,.lage a{font:700 2.6vh system-ui,sans-serif;color:#04130c;
    background:#2bb47e;border:none;border-radius:1.6vh;padding:2vh 4vh;
    text-decoration:none;cursor:pointer}
  .lage a{background:none;color:#8a97a8;border:1px solid #2a323f;padding:1.6vh 3vh}
  #ende{display:none}
</style></head><body>
<canvas id="c"></canvas>

<div class="lage" id="start">
  <h1>Sonnenlauf</h1>
  <div class="mut">Sonne einsammeln, Hindernissen ausweichen.<br>
    Tippen zum Springen — länger halten springt höher.</div>
  <button id="los">Los geht's</button>
  <a href="/wand">Zurück zur Anzeige</a>
</div>

<div class="lage" id="ende">
  <h1>Vorbei</h1>
  <div class="gross" id="punkte">0,0 kWh</div>
  <div class="mut" id="rekord"></div>
  <button id="nochmal">Nochmal</button>
  <a href="/wand">Zurück zur Anzeige</a>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

let B = 0, H = 0, sH = 0, sY = 0, boden = 0, dpr = 1;
function messen(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  B = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(B * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Gespielt wird in einem BAND, nicht auf der ganzen Flaeche. Auf einem
  // 1080x1920-Display haette man sonst 1400 px leeren Himmel ueber einer
  // kleinen Figur — die Proportionen stimmen nur, wenn das Spielfeld ein
  // eigenes Seitenverhaeltnis behaelt.
  sH = Math.min(H * 0.78, B * 0.85);
  sY = (H - sH) * 0.5;
  boden = sY + sH * 0.80;
}
addEventListener('resize', messen); messen();

/* Grundmass ist die KLEINERE Bildschirmseite. An der Hoehe allein duerfte
   es nicht haengen: auf einem 1080x1920-Hochformat waere das Lauftempo dann
   an der Hoehe bemessen, die Figur aber nur 1080 px Weg vor sich — sie
   raste in einer Sekunde durchs Bild und niemand koennte reagieren. */
const E = () => Math.min(B, sH) / 100;

const spiel = {
  laeuft: false, t: 0, tempo: 0, weg: 0, sonne: 0,
  y: 0, vy: 0, amBoden: true, sprungHalten: 0,
  hindernisse: [], sonnen: [], huegel: [],
};

const SCHWERKRAFT = () => 240 * E();      // px/s^2
const SPRUNG      = () => -95 * E();      // Anfangsgeschwindigkeit
const HALTEKRAFT  = () => -150 * E();     // solange gehalten wird
const HALTE_MAX   = 0.22;                 // Sekunden
const FIGUR       = () => 7 * E();        // halbe Kantenlaenge

function start(){
  Object.assign(spiel, {laeuft: true, t: 0, tempo: 46 * E(), weg: 0, sonne: 0,
    y: 0, vy: 0, amBoden: true, sprungHalten: 0,
    hindernisse: [], sonnen: [], huegel: []});
  for (let i = 0; i < 9; i++)
    spiel.huegel.push({x: i * B / 3, h: (6 + Math.random() * 9) * E(),
                       w: (25 + Math.random() * 30) * E()});
  naechstes(B * 1.2);
  $('start').style.display = 'none'; $('ende').style.display = 'none';
  letzte = performance.now();
  requestAnimationFrame(takt);
}

/* Der Abstand zum naechsten Hindernis wird aus der Sprungdauer berechnet —
   so ist JEDES Hindernis erreichbar. Ein Lauf, der unfair wird, sobald es
   schnell geht, macht keinen Spass. */
function naechstes(x){
  const flugzeit = 2 * Math.abs(SPRUNG()) / SCHWERKRAFT() + HALTE_MAX;
  const mindest = spiel.tempo * flugzeit * 1.15 + 10 * E();
  const lx = x + mindest + Math.random() * mindest * 0.8;
  const hoch = Math.random() < 0.25;
  spiel.hindernisse.push({x: lx, b: (5 + Math.random() * 4) * E(),
                          h: (hoch ? 13 : 8) * E()});
  if (Math.random() < 0.8)
    spiel.sonnen.push({x: lx + mindest * 0.45,
                       y: boden - (14 + Math.random() * 16) * E(),
                       r: 3.2 * E(), weg: false});
}

function springen(){
  if (!spiel.laeuft) return;
  if (spiel.amBoden){
    spiel.vy = SPRUNG(); spiel.amBoden = false; spiel.sprungHalten = HALTE_MAX;
  }
}
function loslassen(){ spiel.sprungHalten = 0; }

let letzte = 0;
function takt(jetzt){
  if (!spiel.laeuft) return;
  // Zeitschritt begrenzen: nach einem Tab-Wechsel waere dt sonst riesig und
  // die Figur wuerde durch Hindernisse hindurchspringen.
  const dt = Math.min(0.05, (jetzt - letzte) / 1000);
  letzte = jetzt;
  rechnen(dt);
  zeichnen();
  requestAnimationFrame(takt);
}

function rechnen(dt){
  spiel.t += dt;
  spiel.tempo = Math.min(88 * E(), 46 * E() + spiel.t * 1.2 * E());
  spiel.weg += spiel.tempo * dt;

  if (spiel.sprungHalten > 0){
    spiel.vy += HALTEKRAFT() * dt;
    spiel.sprungHalten -= dt;
  }
  spiel.vy += SCHWERKRAFT() * dt;
  spiel.y += spiel.vy * dt;
  if (spiel.y > 0){ spiel.y = 0; spiel.vy = 0; spiel.amBoden = true; }

  const fx = B * 0.22, f = FIGUR();
  for (const o of spiel.hindernisse) o.x -= spiel.tempo * dt;
  for (const s of spiel.sonnen) s.x -= spiel.tempo * dt;
  for (const h of spiel.huegel){
    h.x -= spiel.tempo * 0.25 * dt;          // Parallaxe: hinten langsamer
    if (h.x + h.w < 0) h.x += B * 3;
  }

  // Zusammenstoss: Rechteck gegen Rechteck, mit etwas Nachsicht am Rand
  const fy = boden + spiel.y;
  for (const o of spiel.hindernisse){
    if (o.x < fx + f * 0.8 && o.x + o.b > fx - f * 0.8
        && fy > boden - o.h + f * 0.35){
      return ende();
    }
  }
  for (const s of spiel.sonnen){
    if (s.weg) continue;
    const dx = s.x - fx, dy = s.y - (fy - f);
    if (dx * dx + dy * dy < (s.r + f) * (s.r + f)){ s.weg = true; spiel.sonne++; }
  }

  spiel.hindernisse = spiel.hindernisse.filter(o => o.x + o.b > -50);
  spiel.sonnen = spiel.sonnen.filter(s => s.x > -50 && !s.weg);
  const letztesX = spiel.hindernisse.length
    ? Math.max(...spiel.hindernisse.map(o => o.x)) : 0;
  if (letztesX < B * 1.3) naechstes(Math.max(letztesX, B));
}

function punkte(){ return spiel.weg / (60 * E()) + spiel.sonne * 2.5; }

function zeichnen(){
  ctx.clearRect(0, 0, B, H);
  ctx.fillStyle = '#0b0f16'; ctx.fillRect(0, 0, B, H);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, sY, B, sH); ctx.clip();   // nur im Band malen

  // Himmel
  const g = ctx.createLinearGradient(0, sY, 0, boden);
  g.addColorStop(0, '#0b0f16'); g.addColorStop(1, '#16243a');
  ctx.fillStyle = g; ctx.fillRect(0, sY, B, boden - sY);

  // Huegel im Hintergrund
  ctx.fillStyle = '#1b2740';
  for (const h of spiel.huegel){
    ctx.beginPath();
    ctx.moveTo(h.x, boden);
    ctx.quadraticCurveTo(h.x + h.w / 2, boden - h.h * 2.4, h.x + h.w, boden);
    ctx.fill();
  }

  // Boden
  ctx.fillStyle = '#121a28'; ctx.fillRect(0, boden, B, sY + sH - boden);
  ctx.strokeStyle = '#2bb47e'; ctx.lineWidth = Math.max(2, 0.4 * E());
  ctx.beginPath(); ctx.moveTo(0, boden); ctx.lineTo(B, boden); ctx.stroke();

  // Hindernisse — schlichte Leitkegel
  for (const o of spiel.hindernisse){
    ctx.fillStyle = '#e0553f';
    ctx.beginPath();
    ctx.moveTo(o.x, boden);
    ctx.lineTo(o.x + o.b / 2, boden - o.h);
    ctx.lineTo(o.x + o.b, boden);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f5f0ec';
    ctx.fillRect(o.x + o.b * 0.18, boden - o.h * 0.45, o.b * 0.64, o.h * 0.13);
  }

  // Sonnen
  for (const s of spiel.sonnen){
    ctx.fillStyle = '#f2c14a';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 7); ctx.fill();
    ctx.strokeStyle = '#f2c14a'; ctx.lineWidth = Math.max(1.5, 0.3 * E());
    for (let i = 0; i < 8; i++){
      const w = i / 8 * Math.PI * 2 + spiel.t * 1.6;
      ctx.beginPath();
      ctx.moveTo(s.x + Math.cos(w) * s.r * 1.4, s.y + Math.sin(w) * s.r * 1.4);
      ctx.lineTo(s.x + Math.cos(w) * s.r * 1.9, s.y + Math.sin(w) * s.r * 1.9);
      ctx.stroke();
    }
  }

  // Figur: ein Funke mit Beinen — bewusst etwas Eigenes
  const fx = B * 0.22, f = FIGUR(), fy = boden + spiel.y;
  ctx.fillStyle = '#5aa9ff';
  ctx.beginPath();
  ctx.roundRect(fx - f, fy - f * 2, f * 2, f * 2, f * 0.55);
  ctx.fill();
  ctx.fillStyle = '#0b0f16';                        // Augen
  ctx.beginPath();
  ctx.arc(fx + f * 0.15, fy - f * 1.35, f * 0.22, 0, 7);
  ctx.arc(fx + f * 0.7,  fy - f * 1.35, f * 0.22, 0, 7);
  ctx.fill();
  if (spiel.amBoden){                               // Beine nur am Boden
    const s = Math.sin(spiel.t * 18) * f * 0.5;
    ctx.strokeStyle = '#5aa9ff'; ctx.lineWidth = f * 0.32;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(fx - f * 0.3, fy - f * 0.1); ctx.lineTo(fx - f * 0.3 + s, fy);
    ctx.moveTo(fx + f * 0.3, fy - f * 0.1); ctx.lineTo(fx + f * 0.3 - s, fy);
    ctx.stroke();
  }

  ctx.restore();

  // Punktestand ueber dem Spielfeld — dort ist auf hohen Bildschirmen Platz
  ctx.fillStyle = '#e8edf4';
  ctx.font = `700 ${4 * E()}px system-ui, sans-serif`;
  ctx.textAlign = 'left';
  ctx.fillText(punkte().toFixed(1).replace('.', ',') + ' kWh',
               3 * E(), sY - 2.2 * E());
  ctx.fillStyle = '#f2c14a';
  ctx.font = `600 ${2.8 * E()}px system-ui, sans-serif`;
  ctx.textAlign = 'right';
  ctx.fillText('☀ ' + spiel.sonne, B - 3 * E(), sY - 2.2 * E());
  ctx.textAlign = 'left';
}

function ende(){
  spiel.laeuft = false;
  const p = punkte();
  let best = 0;
  // localStorage kann fehlschlagen (privates Fenster, gesperrte Daten) —
  // dann laeuft das Spiel trotzdem, nur ohne Bestwert.
  try{
    best = parseFloat(localStorage.getItem('sonnenlauf') || '0') || 0;
    if (p > best){ best = p; localStorage.setItem('sonnenlauf', String(p)); }
  }catch(e){}
  $('punkte').textContent = p.toFixed(1).replace('.', ',') + ' kWh';
  $('rekord').textContent = best
    ? 'Bestwert: ' + best.toFixed(1).replace('.', ',') + ' kWh · '
      + spiel.sonne + ' Sonnen eingesammelt'
    : spiel.sonne + ' Sonnen eingesammelt';
  $('ende').style.display = 'flex';
  // Wandanzeige: von allein zurueck, damit nicht tagelang "Vorbei" leuchtet
  clearTimeout(ende._t);
  ende._t = setTimeout(() => { location.href = '/wand'; }, 60000);
}

$('los').onclick = start;
$('nochmal').onclick = start;
addEventListener('pointerdown', e => {
  if (e.target.closest('button, a')) return;    // Knoepfe nicht abfangen
  springen();
});
addEventListener('pointerup', loslassen);
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp'){
    e.preventDefault();
    if (!spiel.laeuft) start(); else springen();
  }
});
addEventListener('keyup', loslassen);
</script>
</body></html>
